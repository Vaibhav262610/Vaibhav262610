<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="vtitle vdesc">
  <title id="vtitle">Valorant-style agent intro strip</title>
  <desc id="vdesc">A Valorant-inspired red, navy, and off-white strip with an animated crosshair and callout text reading LOCKED IN: AGENT VAIBHAV.</desc>
  <defs>
    <linearGradient id="vbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F1923"/>
      <stop offset=".5" stop-color="#15212c"/>
      <stop offset="1" stop-color="#0F1923"/>
    </linearGradient>
    <clipPath id="vclip">
      <rect width="1200" height="120" rx="14"/>
    </clipPath>
  </defs>
  <g clip-path="url(#vclip)">
    <rect width="1200" height="120" fill="url(#vbg)"/>
    <!-- diagonal accent stripes -->
    <g stroke="#FD4556" stroke-opacity=".18" stroke-width="22">
      <line x1="-50" y1="140" x2="140" y2="-50"/>
      <line x1="30" y1="140" x2="220" y2="-50"/>
      <line x1="1060" y1="170" x2="1260" y2="-30">
        <animate attributeName="x1" values="1060;1000;1060" dur="3s" repeatCount="indefinite"/>
      </line>
    </g>
    <!-- scanning line -->
    <rect x="0" y="0" width="3" height="120" fill="#FD4556" opacity=".7">
      <animate attributeName="x" values="0;1197;0" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- crosshair, left -->
    <g transform="translate(70,60)">
      <circle r="22" fill="none" stroke="#ECE8E1" stroke-width="1.5" opacity=".5"/>
      <circle r="3.5" fill="#FD4556">
        <animate attributeName="r" values="3.5;5;3.5" dur="1.1s" repeatCount="indefinite"/>
      </circle>
      <line x1="-34" y1="0" x2="-14" y2="0" stroke="#ECE8E1" stroke-width="2"/>
      <line x1="14" y1="0" x2="34" y2="0" stroke="#ECE8E1" stroke-width="2"/>
      <line x1="0" y1="-34" x2="0" y2="-14" stroke="#ECE8E1" stroke-width="2"/>
      <line x1="0" y1="14" x2="0" y2="34" stroke="#ECE8E1" stroke-width="2"/>
      <circle r="22" fill="none" stroke="#FD4556" stroke-width="1.5">
        <animate attributeName="r" values="18;26;18" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- callout text -->
    <g font-family="'Segoe UI',Arial,sans-serif">
      <text x="130" y="46" fill="#FD4556" font-size="13" font-weight="700" letter-spacing="3">LOCKED IN</text>
      <text x="130" y="78" fill="#ECE8E1" font-size="28" font-weight="800" letter-spacing="1">AGENT&#160;<tspan fill="#FD4556">VAIBHAV</tspan></text>
    </g>

    <!-- right side: rank / status readout -->
    <g font-family="Consolas,'Courier New',monospace" text-anchor="end">
      <text x="1130" y="38" fill="#7c8a93" font-size="12" letter-spacing="2">MAP // README.MD</text>
      <text x="1130" y="62" fill="#ECE8E1" font-size="16" font-weight="700" letter-spacing="1.5">STATUS: SHIPPING CODE</text>
      <text x="1130" y="84" fill="#7c8a93" font-size="12" letter-spacing="2">ROLE // FULL STACK + AI AGENTS</text>
    </g>

    <!-- spike-style blinking indicator -->
    <g transform="translate(1130,100)">
      <rect x="-10" y="-8" width="20" height="16" rx="2" fill="#FD4556">
        <animate attributeName="opacity" values="1;.25;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
