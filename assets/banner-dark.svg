<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Vaibhav Rajpoot — Building with agents. Thinking in systems.</title>
  <desc id="description">An ink and lime banner with an agent connected to context, tools, memory, and action.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11171c"/><stop offset="1" stop-color="#0d1217"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#b9ef63" stop-opacity=".10"/><stop offset="1" stop-color="#b9ef63" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#34413d"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#background)"/>
  <rect x="780" y="73" width="368" height="252" fill="url(#dots)" opacity=".55"/>
  <circle cx="980" cy="205" r="165" fill="url(#glow)"/>
  <path d="M64 76H1136M64 359H1136" stroke="#2c363b"/>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <circle cx="71" cy="44" r="6" fill="#b9ef63"/>
    <text x="90" y="51" fill="#f0f4ed" font-size="20" font-weight="650" letter-spacing=".6">VAIBHAV RAJPOOT</text>
    <text x="1136" y="49" text-anchor="end" fill="#98a7a8" font-size="14" letter-spacing="1.6">FULL STACK / AGENTIC AI / MODELS</text>
    <text x="64" y="178" fill="#f0f4ed" font-size="60" font-weight="700" letter-spacing="-2">Building with agents.</text>
    <text x="64" y="243" fill="#b9ef63" font-size="60" font-weight="700" letter-spacing="-2">Thinking in systems.</text>
    <text x="67" y="287" fill="#a6b3b5" font-size="21">Curious about models. Serious about building.</text>
  </g>
  <g font-family="Consolas,'Courier New',monospace">
    <text x="66" y="119" fill="#b9ef63" font-size="13" letter-spacing="2.2">THE CURRENT RABBIT HOLE</text>
    <text x="67" y="330" fill="#839396" font-size="14">// always learning. always building.</text>
    <text x="64" y="384" fill="#839396" font-size="12" letter-spacing="1.3">VAIBHAV262610</text>
    <text x="1136" y="384" text-anchor="end" fill="#839396" font-size="12" letter-spacing="1.3">LEARN / BUILD / EVALUATE / REPEAT</text>
  </g>
  <path d="M758 110V316" stroke="#2c363b" stroke-dasharray="3 7"/>
  <g fill="none" stroke-linecap="round" stroke-width="1.8">
    <path d="M852 128C899 128 894 161 938 181" stroke="#7daa55"/>
    <path d="M1022 181C1056 155 1051 128 1098 128" stroke="#68a398"/>
    <path d="M1098 264C1052 264 1059 246 1023 229" stroke="#68a398"/>
    <path d="M937 230C901 248 902 264 852 264" stroke="#7daa55"/>
    <path d="M840 278C840 335 1110 335 1110 278" stroke="#506064" stroke-dasharray="4 6"/>
  </g>
  <g font-family="Consolas,'Courier New',monospace" text-anchor="middle" font-size="13" letter-spacing="1.5">
    <text x="980" y="104" fill="#98a7a8">THE AGENT LOOP</text>
    <text x="840" y="107" fill="#acc891">CONTEXT</text>
    <text x="1110" y="107" fill="#96c4bd">TOOLS</text>
    <text x="840" y="298" fill="#acc891">ACTION</text>
    <text x="1110" y="298" fill="#96c4bd">MEMORY</text>
    <text x="980" y="339" fill="#98a7a8" font-size="12" letter-spacing=".4">observe → decide → act</text>
  </g>
  <g>
    <circle cx="840" cy="128" r="12" fill="#1d2c21" stroke="#b9ef63"/>
    <circle cx="1110" cy="128" r="12" fill="#172b2a" stroke="#7cd4c3"/>
    <circle cx="840" cy="264" r="12" fill="#1d2c21" stroke="#b9ef63"/>
    <circle cx="1110" cy="264" r="12" fill="#172b2a" stroke="#7cd4c3"/>
    <circle cx="980" cy="205" r="58" fill="#b9ef63" fill-opacity=".035" stroke="#506442" stroke-dasharray="2 5"/>
    <circle cx="980" cy="205" r="49" fill="#17231c" stroke="#b9ef63" stroke-width="1.5"/>
    <g fill="#b9ef63">
      <circle cx="967" cy="190" r="3"/><circle cx="980" cy="190" r="3"/><circle cx="993" cy="190" r="3"/>
    </g>
    <text x="980" y="222" font-family="Consolas,'Courier New',monospace" text-anchor="middle" fill="#e6f4d6" font-size="16" letter-spacing="2">AGENT</text>
  </g>
