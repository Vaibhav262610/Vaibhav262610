<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title description">
  <title id="title">Vaibhav Rajpoot — Building with agents. Thinking in systems.</title>
  <desc id="description">An ivory and forest green banner with an agent connected to context, tools, memory, and action.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f6f8f2"/><stop offset="1" stop-color="#edf2e9"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#6b9e3d" stop-opacity=".10"/><stop offset="1" stop-color="#6b9e3d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b6c5ae"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="20" fill="url(#background)"/>
  <rect x="780" y="73" width="368" height="252" fill="url(#dots)" opacity=".55"/>
  <circle cx="980" cy="205" r="165" fill="url(#glow)"/>
  <path d="M64 76H1136M64 359H1136" stroke="#d4ddce"/>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <circle cx="71" cy="44" r="6" fill="#476f29"/>
    <text x="90" y="51" fill="#1b2a24" font-size="20" font-weight="650" letter-spacing=".6">VAIBHAV RAJPOOT</text>
    <text x="1136" y="49" text-anchor="end" fill="#5d7068" font-size="14" letter-spacing="1.6">FULL STACK / AGENTIC AI / MODELS</text>
    <text x="64" y="178" fill="#1b2a24" font-size="60" font-weight="700" letter-spacing="-2">Building with agents.</text>
    <text x="64" y="243" fill="#476f29" font-size="60" font-weight="700" letter-spacing="-2">Thinking in systems.</text>
    <text x="67" y="287" fill="#5b7068" font-size="21">Curious about models. Serious about building.</text>
  </g>
  <g font-family="Consolas,'Courier New',monospace">
    <text x="66" y="119" fill="#476f29" font-size="13" letter-spacing="2.2">THE CURRENT RABBIT HOLE</text>
    <text x="67" y="330" fill="#63796f" font-size="14">// always learning. always building.</text>
    <text x="64" y="384" fill="#63796f" font-size="12" letter-spacing="1.3">VAIBHAV262610</text>
    <text x="1136" y="384" text-anchor="end" fill="#63796f" font-size="12" letter-spacing="1.3">LEARN / BUILD / EVALUATE / REPEAT</text>
  </g>
  <path d="M758 110V316" stroke="#d4ddce" stroke-dasharray="3 7"/>
  <g fill="none" stroke-linecap="round" stroke-width="1.8">
    <path d="M852 128C899 128 894 161 938 181" stroke="#769757"/>
    <path d="M1022 181C1056 155 1051 128 1098 128" stroke="#4c8d7d"/>
    <path d="M1098 264C1052 264 1059 246 1023 229" stroke="#4c8d7d"/>
    <path d="M937 230C901 248 902 264 852 264" stroke="#769757"/>
    <path d="M840 278C840 335 1110 335 1110 278" stroke="#9baf9f" stroke-dasharray="4 6"/>
  </g>
  <g font-family="Consolas,'Courier New',monospace" text-anchor="middle" font-size="13" letter-spacing="1.5">
    <text x="980" y="104" fill="#5d7068">THE AGENT LOOP</text>
    <text x="840" y="107" fill="#486735">CONTEXT</text>
    <text x="1110" y="107" fill="#316d5d">TOOLS</text>
    <text x="840" y="298" fill="#486735">ACTION</text>
    <text x="1110" y="298" fill="#316d5d">MEMORY</text>
    <text x="980" y="339" fill="#5d7068" font-size="12" letter-spacing=".4">observe → decide → act</text>
  </g>
  <g>
    <circle cx="840" cy="128" r="12" fill="#e2ecd8" stroke="#476f29"/>
    <circle cx="1110" cy="128" r="12" fill="#dfefe7" stroke="#387764"/>
    <circle cx="840" cy="264" r="12" fill="#e2ecd8" stroke="#476f29"/>
    <circle cx="1110" cy="264" r="12" fill="#dfefe7" stroke="#387764"/>
    <circle cx="980" cy="205" r="58" fill="#476f29" fill-opacity=".035" stroke="#a1b48d" stroke-dasharray="2 5"/>
    <circle cx="980" cy="205" r="49" fill="#e1ecd6" stroke="#476f29" stroke-width="1.5"/>
    <g fill="#476f29">
      <circle cx="967" cy="190" r="3"/><circle cx="980" cy="190" r="3"/><circle cx="993" cy="190" r="3"/>
    </g>
    <text x="980" y="222" font-family="Consolas,'Courier New',monospace" text-anchor="middle" fill="#28431c" font-size="16" letter-spacing="2">AGENT</text>
  </g>
